name: Supabase Keepalive

# Prevents Supabase free-tier project from pausing due to inactivity.
# Runs daily at 08:00 UTC: inserts a keepalive log row, then prunes
# entries older than 7 days to avoid unbounded table growth.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-keepalive-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (insert keepalive log)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not set - skipping."
            exit 0
          fi
          # Insert a keepalive log row
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/keepalive_logs" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            --max-time 30)
          echo "POST keepalive_logs -> HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Keepalive insert returned HTTP ${HTTP_CODE} (table may not exist yet)."
          fi

      - name: Prune old keepalive logs (>7 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            exit 0
          fi
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                   || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE "${SUPABASE_URL}/rest/v1/keepalive_logs?pinged_at=lt.${CUTOFF}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --max-time 30)
          echo "DELETE keepalive_logs older than ${CUTOFF} -> HTTP ${HTTP_CODE}"